<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Animacje</title>
    <script>
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault()
                if ($("#nick").val()==""){
                    $("#info").text("podaj nick")
                }else{
                    $("#info").text("witaj "+$('#nick').val())
                }
            })

            $("#formu2").submit(function(a){
                a.preventDefault()
                if ($("#pass").val().length <= 6){
                    $("#info2").text("haslo jest za krotkie").css("color","red")
                }else{
                    $("#info2").text("zalogowano").css("color","green")
                }
            })
        })

    </script>
    <style>

    </style>
</head>
<body>    
    <form id="formularz">
        <input type="text" id="nick">
        <button type="submit">wyslij</button>
    </form>
    <hr>
    <form id="formu2">
        <input type="email" id="emial">
        <input type="password" id="pass">
        <button type="submit">wyslij</button>
    </form>
    <hr>
    <select id="cos">
        <option value="">20</option>
        <option value="">30</option>
        <option value="">40</option>
    </select>
    <p id="info"></p>
    <p id="info2"></p>
</body>
</html>
